global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: users_service
    metrics_path: /metrics
    static_configs:
      - targets: ["users_service:8001"]

  - job_name: rooms_service
    metrics_path: /metrics
    static_configs:
      - targets: ["rooms_service:8002"]

  - job_name: requests_service
    metrics_path: /metrics
    static_configs:
      - targets: ["requests_service:8003"]
