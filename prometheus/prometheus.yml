global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["${GATEWAY_HOST}"]

  - job_name: users_service
    metrics_path: /metrics
    static_configs:
      - targets: ["${USERS_HOST}"]

  - job_name: rooms_service
    metrics_path: /metrics
    static_configs:
      - targets: ["${ROOMS_HOST}"]

  - job_name: requests_service
    metrics_path: /metrics
    static_configs:
      - targets: ["${REQUESTS_HOST}"]
